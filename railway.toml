[build]
builder = "NIXPACKS"
buildCommand = "npm install --include=dev && npm run build"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Persistent volume — survives redeploys.
# Railway will automatically provision this volume on first deploy.
# All analytics data and admin content edits are stored here.
[[mounts]]
mountPath = "/app/data"
